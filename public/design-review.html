 if(s.kind==='booking'||s.kind==='finance'){const rows=s.items.map(item=>{const [k,v]=split(item);return '<div class="data-row"><dt>'+escape(k)+'</dt><dd>'+escape(v||k)+'</dd></div>';}).join('');return panel('<div class="section-heading"><h2>'+(s.kind==='finance'?'Расчёты за период':'Условия бронирования')+'</h2>'+'</div><dl class="summary">'+rows+'</dl>'+(s.id==='booking-review'?'<div class="total"><span>Стоимость проживания</span><strong>18 000 ₸</strong></div><div class="notice">Депозит 10 000 ₸ учитывается отдельно. Отправка заявки не списывает деньги.</div><label class="check"><input type="checkbox">Согласен с датами, тарифом, депозитом и правилами проживания</label>':'')+note+action(s.action,true)+(s.kind==='booking'?'<div class="links"><a href="#">Изменить даты</a><a href="#">Обратиться за помощью</a></div>':''));}
 if(s.kind==='chat')return '<section class="panel chat"><div class="section-heading"><div><h3>'+(s.id==='assistant'?'AI-ассистент':'Чат по процессу')+'</h3><small>Детали брони и условия — в карточке процесса</small></div>'+badge('На связи')+'</div><div class="chat-time">Сегодня</div>'+s.items.map((item,i)=>'<div class="bubble'+(!i?' user':'')+'">'+escape(item)+'</div>').join('')+(s.id==='assistant'?'<div class="actions">'+action('Подобрать жильё',false,true)+action('Мои брони',false,true)+'</div>':'')+'<p class="form-note">'+escape(s.note||'Не передавайте коды доступа и платёжные данные в общем чате.')+'</p><div class="composer"><input placeholder="Напишите сообщение…" aria-label="Сообщение">'+action('Отправить')+'</div></section>';
 if(s.kind==='calendar')return panel('<div class="calendar-head"><h2>Ноябрь 2026</h2><div class="actions">'+action('‹',false,true)+action('›',false,true)+'</div></div><div class="calendar-grid">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>'<span class="day week">'+d+'</span>').join('')+Array.from({length:35},(_,i)=>'<span class="day'+(i===14?' selected':[15,21].includes(i)?' event':'')+'">'+(i<30?i+1:'')+'</span>').join('')+'</div>')+'<div style="margin-top:20px">'+list(s.items)+'</div>'+action(s.action,true);
 if(s.kind==='report')return panel('<h2>Материалы и чек-лист</h2>'+list(s.items)+'<div class="upload"><strong>+ Добавить фото или видео</strong><small>Снимите нужные зоны и проверьте качество материалов.</small></div><div style="margin-top:24px">'+field('Комментарий','Добавьте пояснение к результату',true)+'</div>'+note+action(s.action,true));
 if(s.kind==='dashboard')return '<div class="metrics">'+s.items.map((item,i)=>{const [k,v]=split(item);return '<article class="metric"><small>'+escape(k)+'</small><strong>'+escape(v)+'</strong>'+badge(i?'За сегодня':'Требуют решения',!i)+'</article>';}).join('')+'</div><div class="section-heading"><h2>Рабочая очередь</h2><a href="#">Все задачи →</a></div>'+list(['Проверки допуска|Новые анкеты и объекты ждут решения','Обращения участников|Назначьте ответственного и срок','Состояние платформы|Фоновые проверки работают'])+action(s.action,true);
 if(s.kind==='empty')return '<section class="panel empty"><div class="listicon">'+icon(s.id==='pending'?'calendar':'search')+'</div><h2>'+escape(s.title)+'</h2><p>'+s.items.map(escape).join(' ')+'</p>'+action(s.action)+'</section>';
 if(s.kind==='loading')return panel('<div role="status" aria-label="Загружаем данные"><div class="skeleton hero-skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:65%"></div></div>');
 if(s.kind==='document')return '<article class="panel document">'+s.items.map(title=>'<h2>'+escape(title)+'</h2><p>Понятное описание условий и действий пользователя. Полный текст документа должен быть заполнен и согласован перед запуском.</p>').join('')+note+action(s.action,true)+'</article>';
 if(s.kind==='table'&&!mobile)return '<div class="map-controls">'+field('Поиск','Имя, объект или статус')+action('Все статусы',false,true)+'</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Участник или объект</th><th>Состояние</th><th>Действие</th></tr></thead><tbody>'+s.items.map(item=>{const [k,v]=split(item);return '<tr><td>'+escape(k)+'<small>Демонстрационный пример</small></td><td>'+badge(v||'Ожидает решения',/провер|ожид|чернов/i.test(v||''))+'</td><td><a href="#">Открыть →</a></td></tr>';}).join('')+'</tbody></table></div>'+action(s.action,true);
 const settings=s.kind==='settings'||s.kind==='health';return (s.kind==='list'||s.kind==='table'?'<div style="margin-bottom:20px">'+field('Поиск','Найти по названию или статусу')+'</div>':'')+'<div class="list">'+s.items.map((item,i)=>{const [k,v]=split(item);const suffix=settings&&/Тихие|Предлагать|Нужны фото|Принимать|обязательна/i.test(item)?'<button type="button" class="switch'+(i%2?'':' on')+'" role="switch" aria-checked="'+!(i%2)+'" aria-label="'+escape(k)+'"></button>':s.kind==='health'?badge(/не подключ|проверьте/i.test(v||'')?'Требует настройки':'Работает',/не подключ|проверьте/i.test(v||'')):'';return row(k,v,settings?'settings':'home',suffix);}).join('')+'</div>'+note+action(s.action,true);

function navItems(group){return group==='admin'?['Обзор','Пользователи','Недвижимость','Проверки','Обращения','Безопасность','Настройки']:group==='owner'?['Мои объекты','Заявки гостей','Уборки','Календарь','Сообщения','Управление']:group==='cleaner'?['Задания рядом','Мои задания','Календарь','Сообщения','Выплаты']:['Найти жильё','Мои брони','Календарь','Сообщения','Профиль'];}
function render(s,group,mode){const mobile=mode==='mobile',wide=['home','map','catalog','dashboard','calendar','table'].includes(s.kind),navs=navItems(group),bottom=group==='admin'?['Обзор','Очередь','Обращения','Ещё']:group==='owner'?['Объекты','Заявки','Уборки','Профиль']:group==='cleaner'?['Задания','Моя работа','Чаты','Профиль']:['Поиск','Брони','Чаты','Профиль'];return '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+designCss+'</style></head><body class="page-'+escape(s.id)+'"><div class="app"><aside class="sidebar">'+brand()+'<small>'+names[group]+'</small><nav class="sidenav">'+navs.map((n,i)=>'<a href="#"'+(!i?' class="active"':'')+'>'+icon(['search','home','calendar','chat','person','settings','settings'][i])+'<span>'+n+'</span></a>').join('')+'</nav></aside><main class="workspace"><header class="topbar">'+(mobile?brand():'<span class="context">'+names[group]+' / '+escape(s.title)+'</span>')+'<div class="top-actions"><a class="help" href="#">Помощь</a><span class="avatar" aria-label="Профиль">'+icon('person')+'</span></div></header><div class="page-title"><div class="eyebrow">'+({common:'ВАШЕ ПРОСТРАНСТВО',guest:'ДЛЯ ВАШИХ ПОЕЗДОК',owner:'ВАША НЕДВИЖИМОСТЬ',cleaner:'ВАША РАБОТА',admin:'УПРАВЛЕНИЕ СЕРВИСОМ',states:'СОСТОЯНИЕ ИНТЕРФЕЙСА'}[group])+'</div><h1>'+escape(s.title)+'</h1>'+(!['home','form','booking','chat'].includes(s.kind)&&s.note?'<p class="intro">'+escape(s.note)+'</p>':'')+'</div><div class="content'+(wide?' wide':'')+'"><div class="stack">'+body(s,group,mobile)+'</div>'+(!wide?'<aside class="aside"><section class="panel sticky-summary"><h2>Важно знать</h2><p class="muted">'+escape(s.note||'Проверьте условия и текущий статус перед подтверждением действия.')+'</p><div class="notice">Существенные изменения подтверждаются отдельно.</div><small>Нужна помощь? Откройте чат по процессу или обратитесь в поддержку.</small></section></aside>':'')+'</div></main></div><nav class="bottom-nav" aria-label="Основная навигация">'+bottom.map((n,i)=>'<a href="#"'+(!i?' class="active"':'')+'>'+icon(['search','calendar','chat','person'][i])+'<span>'+n+'</span></a>').join('')+'</nav></body></html>';}
const groupSelect=document.getElementById('group'),screenSelect=document.getElementById('screen'),frame=document.getElementById('preview'),wrap=document.querySelector('.device-wrap');let mode='mobile';
for(const [id,name] of Object.entries(names)){const o=document.createElement('option');o.value=id;o.textContent=name;groupSelect.append(o);}
const query=new URLSearchParams(location.search);if(groups[query.get('group')])groupSelect.value=query.get('group');if(query.get('mode')==='desktop')mode='desktop';
function fit(){const w=mode==='mobile'?390:1440,available=document.querySelector('.stage').clientWidth-(innerWidth<700?32:56),scale=Math.min(1,available/w);frame.style.width=w+'px';frame.style.height=(mode==='mobile'?844:960)+'px';frame.style.transform='scale('+scale+')';wrap.style.width=w*scale+'px';wrap.style.height=(mode==='mobile'?844:960)*scale+'px';}
function update(){const spec=groups[groupSelect.value].find(s=>s.id===screenSelect.value)||groups[groupSelect.value][0];frame.srcdoc=render(spec,groupSelect.value,mode);document.getElementById('mobile').setAttribute('aria-pressed',String(mode==='mobile'));document.getElementById('desktop').setAttribute('aria-pressed',String(mode==='desktop'));const q=new URLSearchParams({group:groupSelect.value,screen:spec.id,mode});history.replaceState(null,'','?'+q);fit();}
function refresh(){screenSelect.replaceChildren();for(const s of groups[groupSelect.value]){const o=document.createElement('option');o.value=s.id;o.textContent=s.title;screenSelect.append(o);}update();}
groupSelect.addEventListener('change',refresh);screenSelect.addEventListener('change',update);for(const m of ['mobile','desktop'])document.getElementById(m).addEventListener('click',()=>{mode=m;update();});addEventListener('resize',fit);refresh();if(groups[groupSelect.value].some(s=>s.id===query.get('screen'))){screenSelect.value=query.get('screen');update();}

</script></body></html>
