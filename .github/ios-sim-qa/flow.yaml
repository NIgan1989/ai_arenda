appId: app.aiarenda.assistant
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Войти"
    timeout: 40000
- takeScreenshot: 01-signin
- tapOn:
    text: "Номер телефона"
    index: 1
- inputText: "+77000000001"
- tapOn:
    text: "Пароль"
    index: 1
- inputText: "Browser-fixture-2026"
- hideKeyboard
- tapOn: "Войти"
- runFlow:
    when:
      visible: "Нет связи.*"
    commands:
      - tapOn: "Войти"
- extendedWaitUntil:
    visible: ".*Владел.*"
    timeout: 30000
- takeScreenshot: 02-roles
- waitForAnimationToEnd
- tapOn:
    text: "(?s).*Владел.*"
    optional: true
- runFlow:
    when:
      visible: "(?s).*В какой роли продолжим.*"
    commands:
      - tapOn:
          point: "50%,46%"
- extendedWaitUntil:
    visible: "Развернуть панель"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 03-map
- tapOn: "Развернуть панель"
- waitForAnimationToEnd
- tapOn: "Уборка .*"
- waitForAnimationToEnd
- takeScreenshot: 04-thread-open
- scrollUntilVisible:
    element: "Открыть уборку"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 04b-button
- tapOn: "Открыть уборку"
- takeScreenshot: 05-after-tap
- extendedWaitUntil:
    visible: "Закрыть и вернуться на карту"
    timeout: 20000
- takeScreenshot: 06-cleaning-card
- tapOn: "Закрыть и вернуться на карту"
- waitForAnimationToEnd
- takeScreenshot: 07-back-on-map
- tapOn: "Развернуть панель"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Бронь .*"
    direction: DOWN
    timeout: 20000
- tapOn: "Бронь .*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Открыть бронь"
    direction: DOWN
    timeout: 20000
- tapOn: "Открыть бронь"
- takeScreenshot: 08a-after-tap
- extendedWaitUntil:
    visible: "Закрыть и вернуться на карту"
    timeout: 20000
- takeScreenshot: 08-booking-card
