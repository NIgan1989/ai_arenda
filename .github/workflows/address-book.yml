name: Address book of Kazakhstan
# Builds the address book (settlements, districts, streets, houses) from the OpenStreetMap extract of Kazakhstan
# and puts it into the photo bucket (R2), where the Worker reads it for address suggestions.
# Runs once a month (3rd day, 02:17 UTC) and by hand. On other branches it only builds and reports, nothing is uploaded.
# Needs CLOUDFLARE_API_TOKEN (the same as publishing: Workers R2 Storage: Edit, Account Settings: Read).
on:
  schedule:
    - cron: '17 2 3 * *'
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - lib/address-text.ts
      - scripts/build-address-book.mjs
      - scripts/upload-address-book.mjs
      - scripts/address-book-sample.mjs
      - .github/workflows/address-book.yml
permissions:
  contents: read
concurrency:
  group: address-book-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download OpenStreetMap of Kazakhstan
        run: |
          mkdir -p outputs/osm
          # Geofabrik first: the file's address comes from its index, retried for about ten minutes. If it stays down,
          # the same extract from openstreetmap.fr, whose file name is read from its folder listing.
          get(){ curl -fsSL --retry 10 --retry-delay 60 --retry-all-errors -o outputs/osm/kz.osm.pbf "$1" || { rm -f outputs/osm/kz.osm.pbf; false; }; }
          url=$(curl -fsSL --retry 3 --retry-all-errors https://download.geofabrik.de/index-v1-nogeom.json | jq -r '.features[].properties|select(.id=="kazakhstan")|.urls.pbf' || true)
          echo "Geofabrik file: ${url:-not in the index}"
          get "${url:-https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf}" || {
            dir=https://download.openstreetmap.fr/extracts/asia/
            list=$(curl -fsSL --retry 5 --retry-all-errors "$dir" || true)
            echo "Mirror listing: ${#list} bytes"
            name=$(printf '%s' "$list" | grep -oi 'kazakhstan[^"<>]*\.osm\.pbf' | grep -v '\.md5' | head -1 || true)
            echo "Mirror file: ${name:-none}"
            [ -n "$name" ] && get "$dir$name"
          }
          test -s outputs/osm/kz.osm.pbf
          ls -la outputs/osm
      - name: Keep settlements, borders, streets and houses
        run: |
          osmium tags-filter outputs/osm/kz.osm.pbf n/place nwr/addr:housenumber w/highway r/boundary=administrative w/place -o outputs/osm/addr.osm.pbf --overwrite
          osmium export outputs/osm/addr.osm.pbf -f geojsonseq --add-unique-id=type_id -o outputs/osm/addr.geojsonseq --overwrite
          ls -la outputs/osm
      - name: Build the address book
        run: node --max-old-space-size=6000 scripts/build-address-book.mjs outputs/osm/addr.geojsonseq outputs/address-book "$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
      - name: Report the sizes
        run: |
          du -sh outputs/address-book
          find outputs/address-book -type f | wc -l
          find outputs/address-book -type f -printf '%s %p\n' | sort -rn | head -15
      - name: Print a small sample for checks
        if: github.ref != 'refs/heads/main'
        run: node scripts/address-book-sample.mjs outputs/address-book
      - name: Find the account
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/resolve-cloudflare-ids.mjs
      - name: Upload to R2
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/upload-address-book.mjs outputs/address-book
      - name: Keep a sample for checks
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: address-book
          path: outputs/address-book
          retention-days: 7
