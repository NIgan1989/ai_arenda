name: iPhone simulator check
# Temporary diagnostic run: builds the iPhone app for the iOS simulator against the local QA stand (scripts/start-browser-qa.mjs),
# signs in as the stand's owner and opens a cleaning and a booking from the autopilot feed. Screenshots and logs go to Artifacts.
on:
  pull_request:
    paths:
      - '.github/workflows/ios-sim-qa.yml'
      - '.github/ios-sim-qa/**'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    concurrency:
      group: ios-sim-qa-${{ github.ref }}
      cancel-in-progress: true
    env:
      EXPO_NO_TELEMETRY: '1'
      API: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd mobile && npm ci --no-audit --no-fund)
      - name: Start the QA stand
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          nohup node scripts/start-browser-qa.mjs > "$RUNNER_TEMP/out/stand.log" 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:5174/ && break; sleep 2; done
          curl -s -X POST "$API/api/auth/login" -H 'content-type: application/json' -H "Origin: $API" -d '{"phone":"+77000000001","password":"x"}' || true
          for s in seed-browser-qa seed-kazakhstan-qa seed-map-qa; do node scripts/$s.mjs --confirm-isolated; done
          python3 .github/ios-sim-qa/scenario.py
      - name: Generate the iOS project
        working-directory: mobile
        env:
          CI: '1'
        run: |
          # The stand is plain http on this machine: let this diagnostic build talk to it.
          sed -i '' "s/(!__DEV__||url.protocol!=='http:')/(url.protocol!=='http:')/" src/api.ts
          grep -q "(url.protocol!=='http:')" src/api.ts
          npx expo prebuild --platform ios
          plist="$(ls ios/*/Info.plist | grep -v Pods | head -n 1)"
          /usr/libexec/PlistBuddy -c 'Delete :NSAppTransportSecurity' "$plist" || true
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' -c 'Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true' "$plist"
      - name: Build for the simulator
        working-directory: mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API }}
        run: |
          workspace="$(ls -d *.xcworkspace | head -n 1)"
          scheme="${workspace%.xcworkspace}"
          if ! xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/out/xcodebuild.log" 2>&1; then
            grep -E 'error:' "$RUNNER_TEMP/out/xcodebuild.log" | head -n 50 || true
            tail -n 100 "$RUNNER_TEMP/out/xcodebuild.log"; exit 1
          fi
          app="$(ls -d "$RUNNER_TEMP"/derived/Build/Products/Release-iphonesimulator/*.app | head -n 1)"
          echo "APP=$app" >> "$GITHUB_ENV"
          (cd "$(dirname "$app")" && zip -qry "$RUNNER_TEMP/out/app-sim.zip" "$(basename "$app")")
      - name: Boot a simulator and install
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print([x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 1")][-1])')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Open a cleaning and a booking
        continue-on-error: true
        run: |
          nohup xcrun simctl spawn "$UDID" log stream --level debug --predicate 'process == "AiQonaq"' > "$RUNNER_TEMP/out/app.log" 2>&1 &
          python3 .github/ios-sim-qa/scenario.py --clear-limits
          cd "$RUNNER_TEMP/out" && maestro --device "$UDID" test "$GITHUB_WORKSPACE/.github/ios-sim-qa/flow.yaml" --format junit --output report.xml --test-output-dir maestro 2>&1 | tee maestro.log
      - name: Final screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/out/final.png" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-sim-qa
          path: ${{ runner.temp }}/out
          retention-days: 7
