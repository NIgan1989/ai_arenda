name: Demo photo candidates
# Temporary helper for the test listings: lists openly licensed photos and keeps numbered contact sheets as an artifact.
on:
  push:
    branches: ['claude/**']
    paths: [scripts/demo-photos/find-candidates.mjs, .github/workflows/demo-photo-candidates.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: command -v montage || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - run: node scripts/demo-photos/find-candidates.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: demo-candidates
          path: outputs/demo-candidates/*.*
